name: SEO Report Relay

# The cloud SEO agent's egress is restricted to git hosts, so it cannot POST
# its daily report to the team portal directly. This workflow fires whenever a
# run log lands in automation/logs/, live-verifies the shipped URLs (Actions
# runners have full egress), and relays the report to the portal — which
# stores the run history and emails the daily report.

on:
  push:
    branches: [main]
    paths:
      - "automation/logs/*.json"

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live-verify shipped URLs and relay report to portal
        env:
          TEAM_LOG_KEY: ${{ secrets.TEAM_LOG_KEY }}
        run: node .github/scripts/relay-report.mjs
