name: CWD Daily SEO Agent

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.email "dev@canadianwebdesigns.com"
          git config user.name "Canadian Web Designs"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/amirkhela/cwd_redesign_by_zam.git

      - name: Install deps
        run: |
          npm ci
          npm install --no-save googleapis nodemailer

      - name: Pull GSC + GA4 + PageSpeed data
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GSC_CWD_TOKENS: ${{ secrets.GSC_CWD_TOKENS }}
          REPORT_PATH: /tmp/cwd_seo_report.txt
        run: node scripts/cwd-daily-audit.js

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Set up Claude credentials
        env:
          CLAUDE_CREDENTIALS: ${{ secrets.CLAUDE_CREDENTIALS }}
        run: |
          mkdir -p ~/.claude
          echo "$CLAUDE_CREDENTIALS" > ~/.claude/.credentials.json

      - name: Run SEO Agent
        env:
          REPO_DIR: ${{ github.workspace }}
          REPORT_PATH: /tmp/cwd_seo_report.txt
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          TODAY=$(date '+%Y-%m-%d')
          PROMPT="Today is $TODAY. Repo root is $REPO_DIR. GSC report is at /tmp/cwd_seo_report.txt. Blog posts are at $REPO_DIR/content/blog/ (MD format). Pages are at $REPO_DIR/src/app/. Run all 9 sections: (0) GSC+GA4 analysis, (1) technical checks, (2) optimize 30+ pages, (3) write 2 blog posts, (4) outreach emails via SMTP user=canadianwebdesigns.emails@gmail.com pass=$SMTP_PASS, (5) technical SEO, (6) git commit and push (git add -A && git commit -m 'Daily SEO $TODAY' && git push origin main), (7) email HTML report to zam.canadianwebdesigns@gmail.com and dev@canadianwebdesigns.com, (8) write summary log. Use exact data from GSC report. Minimum 30 pages optimized, minimum 2 blog posts. Never skip a section."
          claude --model claude-sonnet-4-6 --print "$PROMPT" --dangerously-skip-permissions

      - name: Report to team portal
        if: always()
        env:
          TEAM_LOG_KEY: ${{ secrets.TEAM_LOG_KEY }}
          RUN_RESULT: ${{ job.status }}
        run: |
          curl -s -X POST https://team.canadianwebdesigns.ca/api/github-actions/log \
            -H "Content-Type: application/json" \
            -H "x-log-key: $TEAM_LOG_KEY" \
            -d "{\"automationId\":\"cwd-seo-agent\",\"name\":\"CWD Daily SEO Agent\",\"status\":\"$RUN_RESULT\",\"summary\":\"GitHub Actions run ${{ github.run_number }} - $RUN_RESULT\",\"runAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            || true
